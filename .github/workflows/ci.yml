name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep uv's cache inside the workspace so actions/cache can pick it up.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv_cache

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of requires-python (">=3.12,<3.14").
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Sync dependencies
        # --locked fails if uv.lock is stale vs pyproject.toml, rather than
        # silently re-resolving. Plain sync includes the dev group and skips
        # the notebook group.
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy src/mlpp

      - name: Tests
        # TensorFlow install dominates runtime, so the slow tests are nearly
        # free on top of the fast ones — run the whole suite.
        run: uv run --no-sync pytest -q

  notebook-drift:
    name: notebook matches generator
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Regenerate the notebook
        # notebooks/01_train.ipynb is generated; it must never be hand-edited.
        # Only stdlib is used, so no project sync is needed.
        run: uv run --no-project --python 3.12 python scripts/build_notebook.py

      - name: Fail if it drifted
        run: |
          if ! git diff --quiet -- notebooks/01_train.ipynb; then
            echo "::error file=notebooks/01_train.ipynb::Notebook is out of sync with scripts/build_notebook.py. Regenerate it with: uv run --project apps/backend python scripts/build_notebook.py"
            git diff -- notebooks/01_train.ipynb
            exit 1
          fi
          echo "notebook is in sync"
