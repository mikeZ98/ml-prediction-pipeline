name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep uv's cache inside the workspace so actions/cache can pick it up.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv_cache

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of requires-python (">=3.12,<3.14").
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Sync dependencies
        # --locked fails if uv.lock is stale vs pyproject.toml, rather than
        # silently re-resolving. The notebook group is required: tests/test_notebook.py
        # executes the committed notebook via nbclient, and skipping that gate in CI
        # would recreate the blind spot where a broken notebook reached main unnoticed.
        # The dashboard group is required too: without streamlit installed, mypy
        # (ignore_missing_imports) types `st` as Any and strict mode rejects
        # @st.cache_data / st.selectbox as untyped; tests/test_dashboard.py also
        # imports mlpp.dashboard.loaders, which imports streamlit at module level.
        # --all-extras: the training (torch, mlflow), serving (fastapi) and monitoring
        # (evidently) stacks are optional extras, and each has its own tests.
        run: uv sync --locked --all-extras --group notebook --group dashboard

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy src/mlpp

      - name: Tests
        # The torch install dominates runtime, so the slow tests are nearly
        # free on top of the fast ones — run the whole suite.
        run: uv run --no-sync pytest -q

  notebook-drift:
    name: notebook matches generator
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Check the notebook source matches its generator
        # The notebook is generated; it must never be hand-edited.
        # Compares cell type/id/source and notebook metadata, ignoring `outputs`
        # and `execution_count` so the committed notebook can carry executed
        # results while its code still comes from scripts/build_notebook.py.
        # Only stdlib is used, so no project sync is needed.
        run: uv run --no-project --python 3.12 python scripts/check_notebook_drift.py

  docker:
    name: serving image builds and serves the reference session
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        # The Dockerfile itself fails the build if torch/mlflow leak into the image.
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: docker/api.Dockerfile
          tags: mlpp-api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container against OUTPUTS/example
        run: |
          docker run -d --name mlpp-api --read-only --tmpfs /tmp --cap-drop ALL \
            -p 127.0.0.1:8100:8100 \
            -v "$PWD/OUTPUTS/example:/models/session:ro" mlpp-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8100/health/ready && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8100/health/ready
          # One row naming every column in the manifest: numerics 0.0, categoricals an
          # unseen level (scored, and reported as unseen).
          body=$(python3 -c "import json; f=json.load(open('OUTPUTS/example/manifest.json'))['features']; row={c: 0.0 for c in f['numeric_columns']} | {c: 'smoke' for c in f['categorical_columns']}; print(json.dumps({'records': [row]}))")
          curl -sf -H 'Content-Type: application/json' -d "$body" \
            http://127.0.0.1:8100/v1/predict | tee /dev/stderr | grep -q '"n_records":1'
          test "$(docker inspect -f '{{.Config.User}}' mlpp-api)" = "mlpp"

      - name: Container logs
        if: always()
        run: docker logs mlpp-api || true
