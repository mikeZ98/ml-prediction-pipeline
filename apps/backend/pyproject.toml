[project]
name = "mlpp"
version = "0.1.0"
description = "Time-series / tabular regression pipeline (CNN + Bi-GRU, PyTorch, served via ONNX Runtime)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    # Serving runtime: the API, the predict CLI and the dashboard score through ONNX
    # Runtime, so none of them needs the training framework installed.
    "onnxruntime>=1.20,<2",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# Training stack. Kept out of the core install so the serving image never ships it.
train = [
    "torch>=2.6,<3",
    "onnx>=1.17,<2",
    # The torch.export-based ONNX exporter (the default since torch 2.9) needs it.
    "onnxscript>=0.2,<1",
    "mlflow>=3.0,<4",
    # Training-time plots only; nothing on the serving path draws.
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
]
monitor = [
    "evidently>=0.7.10,<0.8",
]

[project.scripts]
mlpp-train = "mlpp.cli:main"
mlpp-predict = "mlpp.predict_cli:main"
# Needs the `serve` extra.
mlpp-serve = "mlpp.inference.api:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
    # FastAPI/Starlette TestClient transport (Starlette deprecates plain httpx for it).
    "httpx2>=2.16,<3",
]
notebook = [
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: trains or exports a PyTorch model, or runs Evidently; excluded via `-m 'not slow'`",
]
filterwarnings = [
    "error::DeprecationWarning:mlpp.*",
    # Tripwire. joblib.load of a session's scaler/encoder artifacts is the path every dashboard
    # panel depends on; a deprecation there is a silent break waiting on a lockfile refresh.
    # Later filters win, so the scoped ignore below is the only exemption.
    "error::DeprecationWarning:joblib.*",
    # KNOWN, DEFERRED — the one exemption, scoped to its exact message so any *other* joblib
    # deprecation still fails. joblib 1.5.3 does `array.shape = ...` while unpickling, which
    # numpy 2.5 deprecated; it fires from read_fitted_state() on every load_session().
    # numpy>=2.0,<3 permits the release that removes it, so this becomes a real break, not a
    # warning. The fix is a version decision (joblib>=1.6 vs. capping numpy<2.6) and is its own
    # change — see context/foundation/health-check.md, "A numpy deprecation sits directly on the
    # artifact-loading path". Delete this line when that change lands.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.*",
    # MLflow's SQLAlchemy tracking store (third-party, not on mlpp's code path).
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
