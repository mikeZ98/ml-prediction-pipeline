[project]
name = "mlpp"
version = "0.1.0"
description = "Time-series / tabular regression pipeline (CNN + Bi-GRU, Keras 3)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Upper bound is a defect exclusion, not conservatism. TF 2.21.0 paired with numpy 2.5
    # deadlocks on every Keras model execution once a threaded OpenMP/BLAS runtime
    # (scikit-learn's vendored libomp, or numpy's own BLAS) is loaded before TensorFlow —
    # which the TensorFlow-free module split guarantees. The caller blocks forever in
    # `ProcessFunctionLibraryRuntime::RunSync -> Notification::WaitForNotification` while
    # every Eigen worker sits idle: it hangs rather than failing, so the suite stops dead
    # at the first test that runs a model. Either half of the pair avoids it (2.20.0 with
    # numpy 2.5, or 2.21.0 with numpy 2.3); TF is pinned rather than numpy so pandas can
    # stay on 3.x. Revisit when TF 2.22 ships.
    # See context/changes/s-07-tf-sklearn-deadlock/.
    "tensorflow>=2.20,<2.21",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
]

[project.scripts]
mlpp-train = "mlpp.cli:main"
mlpp-predict = "mlpp.predict_cli:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
]
notebook = [
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises TensorFlow/Keras; excluded via `-m 'not slow'`",
]
filterwarnings = [
    "error::DeprecationWarning:mlpp.*",
    # Tripwire. joblib.load of a session's scaler/encoder artifacts is the path every dashboard
    # panel depends on; a deprecation there is a silent break waiting on a lockfile refresh.
    # Later filters win, so the scoped ignore below is the only exemption.
    "error::DeprecationWarning:joblib.*",
    # KNOWN, DEFERRED — the one exemption, scoped to its exact message so any *other* joblib
    # deprecation still fails. joblib 1.5.3 does `array.shape = ...` while unpickling, which
    # numpy 2.5 deprecated; it fires from read_fitted_state() on every load_session().
    # numpy>=2.0,<3 permits the release that removes it, so this becomes a real break, not a
    # warning. The fix is a version decision (joblib>=1.6 vs. capping numpy<2.6) and is its own
    # change — see context/foundation/health-check.md, "A numpy deprecation sits directly on the
    # artifact-loading path". Delete this line when that change lands.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
