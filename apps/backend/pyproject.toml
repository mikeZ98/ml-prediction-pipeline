[project]
name = "mlpp"
version = "0.1.0"
description = "Time-series / tabular regression pipeline (CNN + Bi-GRU, Keras 3)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tensorflow>=2.20,<2.22",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
]

[project.scripts]
mlpp-train = "mlpp.cli:main"
mlpp-predict = "mlpp.predict_cli:main"

[dependency-groups]
dashboard = [
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
]
notebook = [
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises TensorFlow/Keras; excluded via `-m 'not slow'`",
]
filterwarnings = ["error::DeprecationWarning:mlpp.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RET", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
